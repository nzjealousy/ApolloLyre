<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Apollo Lyre</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="app" data-page="dashboard">

  <aside class="sidebar" id="sidebar">
    <a class="sidebar-brand" href="dashboard.html" aria-label="Apollo Lyre dashboard">
      <img src="Assets/apollo-lyre-icon.png" width="703" height="539" alt="">
      <span>Apollo Lyre</span>
    </a>

    <nav aria-label="Main">
      <ul>
        <li><a href="dashboard.html" data-nav="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Dashboard</a></li>
        <li><a href="library.html" data-nav="library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Music Library</a></li>
        <li><a href="playlists.html" data-nav="playlists">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Playlists</a></li>
        <li><a href="analytics.html" data-nav="analytics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Listening Analytics</a></li>
        <li><a href="profile.html" data-nav="profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a></li>
      </ul>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <button type="button" class="btn-icon menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <form class="topbar-search" action="library.html" method="get" role="search">
        <label class="sr-only" for="q">Search songs, artists, albums or playlists</label>
        <input type="search" id="q" name="q" placeholder="Search songs, artists, albums or playlists" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
      </form>

      <!-- notifications -->
      <button type="button" class="btn-icon" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      </button>

      <a class="user-chip" href="profile.html">
        <span class="avatar" aria-hidden="true">U</span>
        <span>[Username]</span>
      </a>
    </div>

    <!--Page content goes here -->
    <main></main>
  </div>

</body>
</html>
